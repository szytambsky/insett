name: Build & Publish Single
run-name: Publish single ${{ inputs.microservice }} from ${{ inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      microservice:
        description: 'Build and push service:'
        required: true
        type: choice
        options:
          - warehouse-service
          - indices-service
      branch:
        description: 'Branch source for publish:'
        type: string
        required: false
        default: main
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.microservice }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.microservice }}
          file: ./${{ inputs.microservice }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
