name: Build & Push Single
run-name: Publish single ${{ inputs.microservice }} from ${{ inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      microservice:
        description: 'Build and push service:'
        required: true
        type: choice
        options:
          - warehouse-service
          - indices-service
      branch:
        description: 'Branch source for publish:'
        type: string
        required: false
        default: main
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
        if: inputs.microservice == 'warehouse-service'

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: temurin
        if: inputs.microservice == 'indices-service'

      - name: Build JAR with Maven
        working-directory: ${{ inputs.microservice }}
        run: mvn -B clean package --file pom.xml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.microservice }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.microservice }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
